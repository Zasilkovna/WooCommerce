    checked: every file of the namespace Packetery\Module\Order
    resolved_by: the module that builds the service container
    blocks: "exposes: submit_to_api"
  - question: Which internal REST routes save the modal data and the stored until date.
    checked: the modal classes of this module
    resolved_by: packetery-module-api
    blocks: "-"
  - question: Which order status the shop wants for each packet status.
    checked: the status mapping is read from the plugin settings
    resolved_by: a person owning the order process
    blocks: "-"
