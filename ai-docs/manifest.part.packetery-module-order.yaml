service: woocommerce
source_commit: 97720cfc
aliases: [packetery-module-order]

assumptions:
  - "Generated on branch docs/teams at commit 97720cfc."
  - "Module boundary taken from the PSR-4 namespace Packetery\\Module\\Order; the committed ai-docs/ast/map.json was produced without --split-psr4, so per-module counts come from a --split-psr4 run of the same tool at the same commit."
  - "The module holds 5949 lines of logic, which is above the 3000 line limit of the split rule. The team decided to document it as one module and to postpone the split."
  - "The STE skill esterka:writing-technical-docs-in-ste was invoked for the prose of this document."

modules:
  - name: packetery-module-order
    path: src/Packetery/Module/Order
    lines: 5949
    doc: reference/packetery-module-order.md

exposes:
  - kind: html
    name: packetery_metabox
    module: packetery-module-order
    consumers: [woocommerce]
    auth: wordpress-capability
    evidence: src/Packetery/Module/Order/Metabox.php#add_meta_boxes
    notes: "Admin metabox on the order detail. It shows the Packeta form and saves its fields."
  - kind: html
    name: packetery_customs_declaration_metabox
    module: packetery-module-order
    consumers: [woocommerce]
    auth: wordpress-capability
    evidence: src/Packetery/Module/Order/CustomsDeclarationMetabox.php#addMetaBoxes
    notes: "Admin metabox for the customs declaration. It is shown only when the carrier needs one."
  - kind: html
    name: submit_to_api
    module: packetery-module-order
    consumers: [woocommerce]
    auth: wordpress-capability
    evidence: src/Packetery/Module/Order/BulkActions.php#addActions
    notes: "Bulk action of the order grid. It submits the packets of the selected orders."
  - kind: other
    name: packetery_sync_order_status
    module: packetery-module-order
    consumers: [woocommerce]
    auth: none
    evidence: src/Packetery/Module/Order/PacketSynchronizer.php#register
    notes: "Action Scheduler hook. It reads the packet status of one order from Packeta."

calls:
  - service: packeta-api
    kind: other
    purpose: Creates, cancels and tracks packets, and downloads label and handover documents over SOAP.
    module: packetery-module-order
    evidence: src/Packetery/Module/Order/PacketSubmitter.php#submitPacket
  - service: packeta-widget-api
    kind: rest
    purpose: Validates the pickup point that the customer selected.
    module: packetery-module-order
    evidence: src/Packetery/Module/Order/PickupPointValidator.php#validate

owns_data:
  - entity: order
    store: mysql
    module: packetery-module-order
    evidence: src/Packetery/Module/Order/Repository.php#createOrAlterTable
    notes: "One table for the Packeta data of a WooCommerce order. The table name comes from the WpdbAdapter property packeteryOrder."

unknowns:
