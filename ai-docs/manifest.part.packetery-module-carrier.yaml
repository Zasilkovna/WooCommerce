    checked: every file of the namespace Packetery\Module\Carrier
    resolved_by: the module that registers the cron service
    blocks: "calls: packeta-widget-api"
  - question: Where the two switches of the car delivery configuration come from.
    checked: the constructor of the configuration class
    resolved_by: the module that builds the service container
    blocks: "-"
  - question: Whether the carrier feed service is the same deployment as the pickup point validation.
    checked: the endpoint constant and the core client of this repository
    resolved_by: Packeta API documentation
    blocks: "calls: packeta-widget-api"
