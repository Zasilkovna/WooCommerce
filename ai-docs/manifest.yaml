  purpose: Reads the courier number of a packet.
  module: packetery-module-labels
  evidence: src/Packetery/Module/Labels/CarrierLabelService.php#handleApiSuccess
- service: packeta-soap-api
  kind: other
  purpose: Validates the sender name of the shop over SOAP.
  module: packetery-module-options
  evidence: src/Packetery/Module/Options/Page.php#processActions
- service: packeta-soap-api
  kind: other
  purpose: Creates, cancels and tracks packets, and downloads label and handover documents
    over SOAP.
  module: packetery-module-order
  evidence: src/Packetery/Module/Order/PacketSubmitter.php#submitPacket
- service: packeta-widget
  kind: rest
  purpose: Validates a pickup point that the customer selected in the widget.
  module: packetery-core
  evidence: src/Packetery/Core/Api/Rest/PickupPointValidate.php#validate
- service: packeta-widget
  kind: other
  purpose: The browser opens the Packeta widget, and the customer selects a pickup
    point or an address in it.
  module: packetery-module-checkout
  evidence: src/Packetery/Module/Checkout/CheckoutSettings.php#createSettings
- service: packeta-widget
  kind: rest
  purpose: Validates the pickup point that the customer selected.
  module: packetery-module-order
  evidence: src/Packetery/Module/Order/PickupPointValidator.php#validate
owns_data:
- entity: carrier
  store: mysql
  module: packetery-module-carrier
  evidence: src/Packetery/Module/Carrier/Repository.php#createOrAlterTable
  notes: One table of the feed carriers. The settings of each carrier live in a WordPress
    option instead.
- entity: category-settings
  store: mysql
  module: packetery-module-productcategory
  evidence: src/Packetery/Module/ProductCategory/Entity.php#META_DISALLOWED_SHIPPING_RATES
  notes: One metadata key of a product category term.
- entity: checkout-data
  store: mysql
  module: packetery-module-checkout
  evidence: src/Packetery/Module/Checkout/CheckoutStorage.php#setTransient
  notes: One WordPress transient for each session. It keeps the selection of the customer
    until the order exists.
- entity: customs-declaration
  store: mysql
  module: packetery-module-customsdeclaration
  evidence: src/Packetery/Module/CustomsDeclaration/Repository.php#createOrAlterTable
  notes: 'Two tables: the declaration of an order and its items. The invoice file
    and the export document are stored in the declaration row.'
- entity: log
  store: mysql
  module: packetery-module-log
  evidence: src/Packetery/Module/Log/Repository.php#createOrAlterTable
  notes: One table of log records. It holds no index other than the primary key.
- entity: order
  store: mysql
  module: packetery-module-order
  evidence: src/Packetery/Module/Order/Repository.php#createOrAlterTable
  notes: One table for the Packeta data of a WooCommerce order. The table name comes
    from the WpdbAdapter property packeteryOrder.
- entity: plugin-schema
  store: mysql
  module: packetery-module-root
  evidence: src/Packetery/Module/Upgrade.php#runCreateTables
  notes: The upgrade creates and alters the five tables of the plugin through the
    repositories that own them.
- entity: product-settings
  store: mysql
  module: packetery-module-product
  evidence: src/Packetery/Module/Product/Entity.php#META_DISALLOWED_SHIPPING_RATES
  notes: Two metadata keys of a WooCommerce product.
- entity: settings
  store: mysql
  module: packetery-module-options
  evidence: src/Packetery/Module/Options/Page.php#saveOptions
  notes: Five WordPress options hold the settings. More options hold the state of
    the plugin between requests.
